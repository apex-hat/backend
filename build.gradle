plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.meridian'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.google.firebase:firebase-admin:9.10.0'
	implementation 'com.openai:openai-java:4.50.0'
	runtimeOnly 'org.postgresql:postgresql'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testRuntimeOnly 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}

// bootRun 전용: .env 파일을 읽어 프로세스 환경변수로 주입한다 (DB_URL, FIREBASE_*, OPENAI_* 등).
// application.yml의 ${VAR} 방식은 그대로 두고, 그 VAR들이 어디서 오는지만 여기서 채워준다.
// .env가 없으면 아무것도 하지 않고 기존 OS 환경변수/기본값 방식으로 동작한다.
def parseEnvFile(File envFile) {
	def vars = [:]
	envFile.eachLine { rawLine ->
		def line = rawLine.trim()
		if (line.isEmpty() || line.startsWith('#')) {
			return
		}
		def matcher = line =~ /^([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*)$/
		if (!matcher.matches()) {
			return
		}
		def key = matcher.group(1)
		def value = matcher.group(2).trim()
		if (value.length() >= 2) {
			def first = value.charAt(0)
			def last = value.charAt(value.length() - 1)
			boolean doubleQuoted = first == ('"' as char) && last == ('"' as char)
			boolean singleQuoted = first == ("'" as char) && last == ("'" as char)
			if (doubleQuoted || singleQuoted) {
				value = value.substring(1, value.length() - 1)
			}
		}
		vars[key] = value
	}
	return vars
}

tasks.named('bootRun') {
	def envFile = file('.env')
	if (envFile.exists()) {
		environment(parseEnvFile(envFile))
	}
}
